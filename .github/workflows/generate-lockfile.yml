name: Generate lockfile

on:
  push:
    branches: [chore-lockfile-20260829-v1]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify lockfile
        run: |
          test -s package-lock.json
          node -e "const l=require('./package-lock.json'); if(l.lockfileVersion !== 3) process.exit(1); if(!l.packages || !l.packages['']) process.exit(1); console.log('package-lock v3 verified')"
      - name: Commit lockfile and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/generate-lockfile.yml
          git commit -m 'Add deterministic npm lockfile'
          git push
