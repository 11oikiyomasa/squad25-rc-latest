name: Fix schema policy syntax v2

on:
  push:
    branches: [fix-schema-policy-v2-20260829]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite policy declarations
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('SUPABASE_SCHEMA.sql')
          text = p.read_text()
          rx = re.compile(r'^create policy if not exists ("[^"]+") on ((?:public|storage)\.[A-Za-z_][A-Za-z0-9_]*)\s+(.+)$', re.I)
          out = []
          changed = 0
          for line in text.splitlines():
              m = rx.match(line)
              if m:
                  out.append(f'drop policy if exists {m.group(1)} on {m.group(2)};')
                  out.append(f'create policy {m.group(1)} on {m.group(2)} {m.group(3)}')
                  changed += 1
              else:
                  out.append(line)
          fixed = '\n'.join(out) + '\n'
          if 'create policy if not exists' in fixed.lower():
              raise SystemExit('Invalid CREATE POLICY syntax remains')
          if changed != 15:
              raise SystemExit(f'Expected 15 policy rewrites, got {changed}')
          if re.search(r'^drop policy if exists .* on .* for ', fixed, re.I | re.M):
              raise SystemExit('DROP POLICY line contains CREATE POLICY clauses')
          p.write_text(fixed)
          print(f'Rewrote {changed} policies')
          PY
      - name: Verify and commit
        run: |
          test $(grep -ic '^create policy ' SUPABASE_SCHEMA.sql) -eq 15
          test $(grep -ic '^drop policy if exists ' SUPABASE_SCHEMA.sql) -eq 15
          ! grep -qi 'create policy if not exists' SUPABASE_SCHEMA.sql
          ! grep -qi '^drop policy if exists .* for ' SUPABASE_SCHEMA.sql
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-schema-policy-v2.yml
          git add SUPABASE_SCHEMA.sql
          git commit -m 'Fix Supabase schema policy syntax'
          git push
