name: Fix verifier and run build

on:
  push:
    branches: [fix-verifier-rls-build-20260829-v1]

permissions:
  contents: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Fix brittle RLS assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify.mjs')
          text = p.read_text()
          old = "assert(read('SUPABASE_SCHEMA.sql').includes('create policy \\\"admin update members\\\"'), 'Admin RLS update policy is missing');"
          new = "assert(/create policy \\\"[^\\\"]+\\\" on public\\.members for all using \\\\(private\\.is_admin\\\\(\\\\)\\\\) with check \\\\(private\\.is_admin\\\\(\\\\)\\\\)/i.test(read('SUPABASE_SCHEMA.sql')), 'Admin RLS policy for member management is missing');"
          if text.count(old) != 1:
              raise SystemExit('Expected brittle RLS assertion exactly once')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify source
        run: npm run verify
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Remove temporary workflow and commit verifier fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify.mjs
          git rm .github/workflows/fix-verifier-rls-build.yml
          git commit -m 'Make RLS verifier semantic'
          git push
