name: Fix verifier and run build

on:
  push:
    branches: [fix-verifier-rls-build-20260829-v1]

permissions:
  contents: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Fix brittle RLS assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify.mjs')
          lines = p.read_text().splitlines()
          hits = [i for i, line in enumerate(lines) if 'Admin RLS update policy is missing' in line]
          if len(hits) != 1:
              raise SystemExit(f'Expected exactly one brittle RLS assertion, found {len(hits)}')
          lines[hits[0]] = r'''assert(/create policy "[^"]+" on public\.members for all using \(private\.is_admin\(\)\) with check \(private\.is_admin\(\)\)/i.test(read('SUPABASE_SCHEMA.sql')), 'Admin RLS policy for member management is missing');'''
          p.write_text('\n'.join(lines) + '\n')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify source
        run: npm run verify
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Remove temporary workflow and commit verifier fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify.mjs
          git rm .github/workflows/fix-verifier-rls-build.yml
          git commit -m 'Make RLS verifier semantic'
          git push
