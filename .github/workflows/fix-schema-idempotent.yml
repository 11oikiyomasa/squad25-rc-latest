name: Fix Supabase schema idempotency

on:
  push:
    branches: [fix-schema-idempotent-20260829]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite schema policies
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          p = Path('SUPABASE_SCHEMA.sql')
          text = p.read_text()
          rx = re.compile(r'^\s*create policy "([^"]+)" on ([^\s;]+)(.*)$', re.I)

          out = []
          created = []
          for line in text.splitlines():
              if line.strip().lower().startswith('drop policy if exists'):
                  continue
              m = rx.match(line)
              if m:
                  name, table, rest = m.groups()
                  out.append(f'drop policy if exists "{name}" on {table};')
                  out.append(line.strip())
                  created.append((name, table))
              else:
                  out.append(line)

          fixed = '\n'.join(out) + '\n'
          drops = re.findall(r'^drop policy if exists "([^"]+)" on ([^;]+);$', fixed, re.I | re.M)
          if 'create policy if not exists' in fixed.lower():
              raise SystemExit('Invalid CREATE POLICY IF NOT EXISTS remains')
          if len(created) != 25:
              raise SystemExit(f'Expected 25 CREATE POLICY statements, got {len(created)}')
          if len(drops) != 25:
              raise SystemExit(f'Expected 25 DROP POLICY statements, got {len(drops)}')
          if sorted(created) != sorted(drops):
              raise SystemExit('DROP/CREATE policy names or tables do not match')

          p.write_text(fixed)
          print(f'Validated {len(created)} policy pairs')
          PY

      - name: Verify and commit
        run: |
          test $(grep -ic '^create policy' SUPABASE_SCHEMA.sql) -eq 25
          test $(grep -ic '^drop policy if exists' SUPABASE_SCHEMA.sql) -eq 25
          ! grep -qi 'create policy if not exists' SUPABASE_SCHEMA.sql
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SUPABASE_SCHEMA.sql
          git rm .github/workflows/fix-schema-idempotent.yml
          git commit -m 'Make Supabase schema idempotent'
          git push
