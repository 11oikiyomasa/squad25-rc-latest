name: Fix admin error state

on:
  push:
    branches: [fix-admin-error-state-20260829-v2]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and test
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/admin-studio.tsx')
          text = p.read_text()
          old = "  const [ready, setReady] = useState(false);\n"
          new = "  const [ready, setReady] = useState(false);\n  const [loadError, setLoadError] = useState<string | null>(null);\n  const [loadAttempt, setLoadAttempt] = useState(0);\n"
          if text.count(old) != 1: raise SystemExit('state anchor mismatch')
          text = text.replace(old, new, 1)
          old = "  useEffect(() => {\n    let cancelled = false;\n"
          new = "  useEffect(() => {\n    let cancelled = false;\n    setLoadError(null);\n"
          if text.count(old) != 1: raise SystemExit('effect anchor mismatch')
          text = text.replace(old, new, 1)
          old = "      .catch((e) => setMessage(e instanceof Error ? e.message : 'Cloud content unavailable'))\n      .finally(() => { if (!cancelled) setReady(true); });\n    return () => { cancelled = true; };\n  }, []);\n"
          new = "      .catch((e) => {\n        const detail = e instanceof Error ? e.message : 'Cloud content unavailable';\n        setMessage(detail);\n        if (!local) setLoadError(detail);\n      })\n      .finally(() => { if (!cancelled) setReady(true); });\n    return () => { cancelled = true; };\n  }, [loadAttempt]);\n"
          if text.count(old) != 1: raise SystemExit('catch anchor mismatch')
          text = text.replace(old, new, 1)
          old = "  if (!ready || !data) return <main className=\"grid min-h-screen place-items-center bg-[#0c0d0f] text-[#f4f0e7]\"><div className=\"text-center\"><div className=\"font-display text-5xl uppercase\">Loading Studio.</div><div className=\"mt-3 text-sm text-white/35\">Checking draft and cloud state…</div></div></main>;\n"
          new = "  if (!ready) return <main className=\"grid min-h-screen place-items-center bg-[#0c0d0f] text-[#f4f0e7]\"><div className=\"text-center\"><div className=\"font-display text-5xl uppercase\">Loading Studio.</div><div className=\"mt-3 text-sm text-white/35\">Checking draft and cloud state…</div></div></main>;\n\n  if (!data) return <main className=\"grid min-h-screen place-items-center bg-[#0c0d0f] px-5 text-[#f4f0e7]\"><div className=\"max-w-md text-center\"><div className=\"font-display text-5xl uppercase\">Studio unavailable.</div><div className=\"mt-3 text-sm leading-6 text-white/45\">{loadError ?? 'No valid draft is available.'}</div><button type=\"button\" onClick={() => { setReady(false); setLoadAttempt((n) => n + 1); }} className=\"mt-6 border border-white/10 px-4 py-3 text-[9px] font-black uppercase tracking-[.18em] hover:border-[#d7ff43]/35\">Retry</button></div></main>;\n"
          if text.count(old) != 1: raise SystemExit('render anchor mismatch')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          python - <<'PY'
          from pathlib import Path
          t = Path('components/admin-studio.tsx').read_text()
          checks = [
            'const [loadError, setLoadError] = useState<string | null>(null);',
            'const [loadAttempt, setLoadAttempt] = useState(0);',
            'if (!data) return <main',
            'onClick={() => { setReady(false); setLoadAttempt((n) => n + 1); }}',
            '}, [loadAttempt]);',
          ]
          for c in checks:
            if c not in t: raise SystemExit(f'missing patch marker: {c}')
          if t.count('if (!data) return <main') != 1: raise SystemExit('unexpected render count')
          print('Admin error-state patch verified')
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/admin-studio.tsx
          git rm .github/workflows/fix-admin-error-state.yml
          git commit -m 'Show retry state when admin cloud content fails'
          git push
