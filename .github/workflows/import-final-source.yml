name: Import final SQUAD.25 source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import-final:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check ready marker
        id: ready
        shell: bash
        run: |
          if [[ -f .transfer-final/FINAL_READY && -f .transfer-final/SHA256 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild and verify source archive
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat $(find .transfer-final -maxdepth 1 -name 'final-*.b64' -print | sort -V) | base64 -d > /tmp/squad25-source.tar.gz
          expected="$(tr -d '[:space:]' < .transfer-final/SHA256)"
          actual="$(sha256sum /tmp/squad25-source.tar.gz | awk '{print $1}')"
          test "$actual" = "$expected"
          rm -rf /tmp/squad25-extract
          mkdir -p /tmp/squad25-extract
          tar -xzf /tmp/squad25-source.tar.gz -C /tmp/squad25-extract
          test -d /tmp/squad25-extract/squad25-work
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name '.transfer' ! -name '.transfer-bin' ! -name '.transfer-final' -exec rm -rf {} +
          cp -a /tmp/squad25-extract/squad25-work/. .
          rm -rf .transfer .transfer-bin .transfer-final .github/workflows/import-final-source.yml
      - name: Commit final source
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import SQUAD.25 final source'
          git push origin main
