name: Repair package lock

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/repair-package-lock.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          rm .github/workflows/repair-package-lock.yml
          git add .github/workflows/repair-package-lock.yml
          if git diff --cached --quiet; then
            echo "No package-lock drift detected."
            exit 0
          fi
          git commit -m "chore(deps): sync package lock"
          git push origin HEAD:main
