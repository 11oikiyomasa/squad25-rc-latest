name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Regression tests
        run: npm run test:regression
      - name: Verify source and agent contract
        run: npm run verify
      - name: Validate AI reviewer runner
        run: |
          python3 -m py_compile scripts/ai_pr_review.py
          test -f .github/workflows/ai-pr-review.yml
          grep -q 'gpt-5.6-sol' scripts/ai_pr_review.py
          grep -q 'gemini-3.1-flash-lite' scripts/ai_pr_review.py
          grep -q 'pull_request_target' .github/workflows/ai-pr-review.yml
          grep -q 'OPENAI_API_KEY' .github/workflows/ai-pr-review.yml
          grep -q 'GEMINI_API_KEY' .github/workflows/ai-pr-review.yml
          grep -q 'AI_REVIEW_PROVIDER: gemini' .github/workflows/ai-pr-review.yml
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Start production server
        run: |
          nohup npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/squad25-server.log 2>&1 &
          echo $! > /tmp/squad25-server.pid
      - name: Smoke test public routes
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          for route in / /roster /scrims /recruitment /member/ryuu /login; do
            echo "Checking $route"
            curl -fsS "http://127.0.0.1:3000$route" >/dev/null
          done
          status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health)
          case "$status" in 200|503) ;; *) echo "Unexpected /api/health status: $status"; cat /tmp/squad25-server.log; exit 1;; esac
      - name: Integration tests
        env:
          TEST_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://wyjsosamlkbwksrslona.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          REQUIRE_SUPABASE_TESTS: "0"
        run: npm run test:integration
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test
      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/squad25-server.pid ]; then kill "$(cat /tmp/squad25-server.pid)" 2>/dev/null || true; fi
